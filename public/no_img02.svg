<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="design to code generation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#8b5cf6"/>
    </marker>
    <clipPath id="designClip"><rect x="18" y="20" width="130" height="100" rx="12"/></clipPath>
    <clipPath id="codeClip"><rect x="102" y="130" width="130" height="100" rx="12"/></clipPath>
  </defs>

  <rect width="250" height="250" rx="16" fill="url(#bg)"/>

  <!-- ===== 左上：デザイン画像（下のレイヤー） ===== -->
  <g>
    <rect x="18" y="20" width="130" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g clip-path="url(#designClip)">
      <circle cx="40" cy="42" r="8" fill="#ef4444"/>
      <circle cx="60" cy="42" r="8" fill="#f59e0b"/>
      <circle cx="80" cy="42" r="8" fill="#22c55e"/>
      <circle cx="100" cy="42" r="8" fill="#3b82f6"/>
      <rect x="34" y="62" width="42" height="42" rx="7" fill="#c7d2fe"/>
      <circle cx="112" cy="84" r="20" fill="#fbcfe8"/>
      <rect x="34" y="110" width="70" height="6" rx="3" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- ===== 変換の矢印（デザイン→コード） ===== -->
  <path d="M118 108 Q140 125 150 142" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- ===== ★（矢印付近） ===== -->
  <g transform="translate(150 116)">
    <path d="M0 -13 L3.6 -3.6 L13 0 L3.6 3.6 L0 13 L-3.6 3.6 L-13 0 L-3.6 -3.6 Z" fill="url(#spark)"/>
    <path d="M13 -18 L15 -13 L20 -11 L15 -9 L13 -4 L11 -9 L6 -11 L11 -13 Z" fill="#a78bfa"/>
  </g>

  <!-- ===== 右下：コード画像（最前面） ===== -->
  <g>
    <rect x="102" y="130" width="130" height="100" rx="12" fill="#0f172a"/>
    <g clip-path="url(#codeClip)">
      <circle cx="118" cy="146" r="3.5" fill="#ef4444"/>
      <circle cx="129" cy="146" r="3.5" fill="#f59e0b"/>
      <circle cx="140" cy="146" r="3.5" fill="#22c55e"/>
      <rect x="118" y="160" width="16" height="6" rx="3" fill="#818cf8"/>
      <rect x="138" y="160" width="44" height="6" rx="3" fill="#38bdf8"/>
      <rect x="128" y="174" width="52" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="128" y="188" width="34" height="6" rx="3" fill="#f472b6"/>
      <rect x="138" y="202" width="60" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="118" y="216" width="26" height="6" rx="3" fill="#818cf8"/>
      <text x="222" y="224" text-anchor="end" fill="#facc15" font-family="ui-monospace, monospace" font-size="15" font-weight="700">&lt;/&gt;</text>
    </g>
  </g>

  <!-- ===== 下部：ステータス ===== -->
  <text x="125" y="244" text-anchor="middle" fill="#94a3b8" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="10" letter-spacing="2">NO IMAGE</text>
</svg>
